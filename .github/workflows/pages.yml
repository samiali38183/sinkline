name: report

# Publishes the HTML report for the benchmark corpus to GitHub Pages, so there is a live
# example of the output. Separate from ci.yml on purpose: if Pages is not enabled for the
# repo, only this workflow fails and the CI badge is unaffected.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["sinkline/**", "bench/corpus/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          mkdir -p _site
          sinkline scan bench/corpus --format html -o _site/index.html
          sinkline scan bench/corpus --format sarif -o _site/corpus.sarif
          python bench/score.py --json _site/score.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
