name: sinkline
description: Interprocedural taint analysis for Python web apps (OWASP Top 10), emitting SARIF for GitHub code scanning.
author: Sami Ali
branding:
  icon: git-branch
  color: red
inputs:
  path:
    description: File or directory to scan
    default: "."
  fail-on:
    description: Fail the job if a finding at/above this severity exists (low|medium|high|critical). Empty = never fail.
    default: ""
  min-confidence:
    description: low|medium|high
    default: "low"
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        ARGS="scan ${{ inputs.path }} --format sarif -o sinkline.sarif --min-confidence ${{ inputs.min-confidence }}"
        if [ -n "${{ inputs.fail-on }}" ]; then ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"; fi
        sinkline $ARGS || echo "SINKLINE_FAILED=1" >> "$GITHUB_ENV"
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sinkline.sarif
        category: sinkline
    - shell: bash
      run: |
        if [ "${SINKLINE_FAILED:-0}" = "1" ]; then echo "::error::sinkline found findings at/above ${{ inputs.fail-on }}"; exit 1; fi
